function patchVideo(src,d){const out=src.slice(),v=new DataView(out.buffer),sec=Math.floor(d.getTime()/1000)+2082844800;function scan(start,end){let pos=start;while(pos+8<=end){let size=v.getUint32(pos),head=8;if(size===1&&pos+16<=end){size=Number(v.getBigUint64(pos+8));head=16}if(size<8||pos+size>end)break;const type=String.fromCharCode(out[pos+4],out[pos+5],out[pos+6],out[pos+7]);if(type==='mvhd'||type==='mdhd'){const o=pos+head,ver=out[o];if(ver===0){v.setUint32(o+4,sec);v.setUint32(o+8,sec)}else if(ver===1){v.setBigUint64(o+4,BigInt(sec));v.setBigUint64(o+12,BigInt(sec))}}if(['moov','trak','mdia'].includes(type))scan(pos+head,pos+size);pos+=size}}scan(0,out.length);return new Blob([out],{type:'video/mp4'})}

jpegDate=function(buffer,newDate){
  const source=new Uint8Array(buffer);

  const parts=[source.slice(0,2),exifSeg(newDate)];

  while(position+4<source.length&&source[position]===255){

    if(!oldExif)parts.push(source.slice(position,end));
    position=end;
